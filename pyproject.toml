[project]
name = "receipt-2-sql"
version = "0.1.0"
description = "Multimodal AI expense tracker: turn text, receipt photos, or voice notes into validated expense records stored in Postgres."
readme = "README.md"
authors = [
    { name = "Rabia L.", email = "mxms203@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "ffmpeg-python>=0.2.0",
    "google-genai>=2.34.0",
    "openai-whisper>=20250625",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"